name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ENG-01)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests et couverture (ENG-02, ENG-03)
        run: npm run test:coverage
      - name: Scan PCI et secrets (SEC-01, SEC-04)
        run: npm run scan
      - name: Dépendances vulnérables (SEC-03)
        run: npm audit --audit-level=high
